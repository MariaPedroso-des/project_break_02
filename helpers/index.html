<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../public/styles.css">
</head>
<body>
  <section class="headerCreate">
    <h2>Tablero de edición</h2>
    <a class="btnCreate" href="/new">Añade un nuevo producto</a>
  </section>
  <section>
    ${productsCards}
  </section>
  
  <a href="/products/${product._id}" class="imgOn">
    <img src="${product.image}" alt="${product.description}">
  </a>
    <h2>${product.name}</h2>
    <p>descripción</p>
    <p>precio</p>
  <section class="formCreate">
    <h2>Nuevo producto</h2>

    <form action="/dashboard/form" method="post" enctype="multipart/form-data">
      <fieldset>
          <div>
            <label>Nombre del producto</label>
            <input type="text" name="name" value="nombre visible del producto" required/>
          </div>
          <div>
            <label>Descripción</label>
            <textarea type="text" name="description" value="Breve descripción del nuevo producto" required></textarea>
          </div>
            <label>Imagen</label>
            <input type="file" name="image" accept="image/jpg, image/jpeg, image/png, image/webp">
          <div>
            <label>Categoría</label>
            <select name="category">${categoryOp}</select>  
          </div>
          <div>
            <label>Color<h6>*solo si es necesario</h6></label>
            <select name="color">${colorOp}</select>
          </div>
          <div>
            <label>Talla<h6>*solo si es necesario</h6></label>
            <select name="size">${sizeOp}</select>
          </div>
          <div>
            <label>Precio</label>
            <input type="number" step="0,01" value="0,01" name="price" required>
          </div>

      <section>
        <input type="reset" value="claer">Limpiar formulario</input>
        <input type="submit" value="create">Crear producto</input>
      </section>
      </fieldset>
    </form>
  </section>
    
</body>
</html>
